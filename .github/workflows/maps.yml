name: Mapy offline

# Co tydzień w czwartek w nocy (świeże mapy przed piątkowymi wyjściami na weekend) albo ręcznie: mapy Mapsforge z OpenStreetMap (Geofabrik)
# – pasma górskie (małe pliki) i całe kraje PL/CZ/SK – w wydaniu „latest” razem z katalogiem maps.json.
on:
  workflow_dispatch:
  schedule:
    # Czwartek 01:41 UTC (02:41/03:41 w Polsce) – mapy są gotowe w czwartek rano.
    - cron: "41 1 * * 4"
  # Zmiana regionów albo workflow – od razu nowe mapy.
  push:
    paths:
      - "regions.json"
      - ".github/workflows/maps.yml"
      - "tools/**"
      - "!tools/safety.py"

permissions:
  contents: write
  actions: read

concurrency:
  group: maps
  cancel-in-progress: false

env:
  WRITER: https://repo1.maven.org/maven2/org/mapsforge/mapsforge-map-writer/0.21.0/mapsforge-map-writer-0.21.0-jar-with-dependencies.jar

jobs:
  ranges:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: Narzędzia (osmium, osmosis + mapsforge-map-writer)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool osmosis
          mkdir -p ~/.openstreetmap/osmosis/plugins
          curl -sSfL --retry 3 -o ~/.openstreetmap/osmosis/plugins/mapsforge-map-writer.jar "$WRITER"
          pip install -q --break-system-packages "osmium>=4"
          python3 tools/tag_mapping.py ~/.openstreetmap/osmosis/plugins/mapsforge-map-writer.jar tag-mapping.xml
      - name: Dane OSM PL + CZ + SK
        run: |
          for c in poland czech-republic slovakia; do
            curl -sSfL --retry 5 --retry-all-errors --retry-delay 20 -o "$c.osm.pbf" "https://download.geofabrik.de/europe/$c-latest.osm.pbf"
          done
          osmium merge poland.osm.pbf czech-republic.osm.pbf slovakia.osm.pbf -o raw.osm.pbf
          rm poland.osm.pbf czech-republic.osm.pbf slovakia.osm.pbf
          # Szlaki turystyczne jako osobne linie z kolorem (trail_red=yes …) – patrz tools/trails.py.
          osmium tags-filter raw.osm.pbf r/route=hiking -o hiking.osm.pbf
          python3 tools/trails.py hiking.osm.pbf trails.osm.pbf
          osmium merge raw.osm.pbf trails.osm.pbf -o all.osm.pbf
          rm raw.osm.pbf hiking.osm.pbf trails.osm.pbf
      - name: Mapy pasm górskich
        env:
          JAVACMD_OPTIONS: -Xmx10g
        run: |
          mkdir -p out
          python3 - <<'PY'
          import json, subprocess
          for r in json.load(open('regions.json', encoding='utf-8'))['ranges']:
              s, w, n, e = r['bbox']
              sub = f"{r['id']}.osm.pbf"
              subprocess.run(['osmium', 'extract', '-b', f'{w},{s},{e},{n}', '--set-bounds', 'all.osm.pbf', '-o', sub, '--overwrite'], check=True)
              subprocess.run(['osmosis', '--rbf', f'file={sub}', '--mapfile-writer', f"file=out/{r['id']}.map",
                              f'bbox={s},{w},{n},{e}', 'type=ram', 'threads=4', 'tag-conf-file=tag-mapping.xml',
                              'comment=MudNav - dane (c) OpenStreetMap, ODbL'], check=True)
              subprocess.run(['rm', sub], check=True)
              print(r['id'], 'gotowe')
          PY
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: maps-ranges
          path: out/*.map
          retention-days: 3

  countries:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        include:
          # Polska w trzech pasach (zachodzą na siebie o ok. 10 km): każdy mieści się w pamięci, a turysta
          # pobiera tylko swój kawałek. Cała Polska budowała się prawie 3 h i ważyła ok. 1 GB.
          - { id: polska-poludnie, geofabrik: poland, bbox: "49.00,14.10,51.10,24.20" }
          - { id: polska-srodek, geofabrik: poland, bbox: "51.00,14.10,52.80,24.20" }
          - { id: polska-polnoc, geofabrik: poland, bbox: "52.70,14.10,54.90,24.20" }
          - { id: czechy, geofabrik: czech-republic }
          - { id: slowacja, geofabrik: slovakia }
    steps:
      - uses: actions/checkout@v4
      - name: Narzędzia
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq osmosis osmium-tool
          mkdir -p ~/.openstreetmap/osmosis/plugins
          curl -sSfL --retry 3 -o ~/.openstreetmap/osmosis/plugins/mapsforge-map-writer.jar "$WRITER"
          pip install -q --break-system-packages "osmium>=4"
          python3 tools/tag_mapping.py ~/.openstreetmap/osmosis/plugins/mapsforge-map-writer.jar tag-mapping.xml
      - name: Odchudzenie danych
        # Mapa kraju: tylko to, co rysuje mapa turystyczna. Bez zwykłych budynków i samych adresów (ok. połowa danych
        # OSM) – zostają budynki z nazwą lub funkcją (schroniska, kościoły, sklepy). Pasma górskie mają pełne dane.
        run: |
          curl -sSfL --retry 5 --retry-all-errors --retry-delay 20 -o in.osm.pbf "https://download.geofabrik.de/europe/${{ matrix.geofabrik }}-latest.osm.pbf"
          osmium tags-filter in.osm.pbf \
            nwr/highway nwr/railway nwr/aeroway nwr/aerialway nwr/waterway nwr/natural nwr/landuse nwr/leisure \
            nwr/amenity nwr/tourism nwr/historic nwr/man_made nwr/place nwr/sport nwr/shop nwr/military nwr/water \
            nwr/wetland nwr/mountain_pass nwr/piste:type nwr/power=line,minor_line,tower nwr/name \
            r/route r/boundary=administrative,national_park,protected_area r/type=multipolygon \
            -o slim.osm.pbf --overwrite
          # Szlaki turystyczne jako osobne linie z kolorem (trail_red=yes …) – patrz tools/trails.py.
          osmium tags-filter in.osm.pbf r/route=hiking -o hiking.osm.pbf
          python3 tools/trails.py hiking.osm.pbf trails.osm.pbf
          rm in.osm.pbf
          osmium merge slim.osm.pbf trails.osm.pbf -o merged.osm.pbf --overwrite
          mv merged.osm.pbf slim.osm.pbf
          rm hiking.osm.pbf trails.osm.pbf
          # Część kraju: wycinek prostokąta (bbox w regions.json: minLat,minLon,maxLat,maxLon; osmium chce lon,lat).
          # Cały kraj też przechodzi przez extract (prostokąt całej Ziemi): plik prosto z `osmium merge` ze szlakami
          # wywracał czytnik osmosis (brak pamięci na samym końcu dróg), po extract działa.
          BBOX="${{ matrix.bbox }}"
          IFS=, read -r s w n e <<< "${BBOX:--89.9,-179.9,89.9,179.9}"
          osmium extract -b "$w,$s,$e,$n" slim.osm.pbf -o part.osm.pbf --overwrite
          mv part.osm.pbf slim.osm.pbf
          ls -la slim.osm.pbf
      - name: Mapa kraju (najpierw w pamięci, przy braku pamięci – na dysku)
        env:
          JAVACMD_OPTIONS: -Xmx14g
        run: |
          mkdir -p out
          write() {
            osmosis --rbf file=slim.osm.pbf --mapfile-writer file=out/${{ matrix.id }}.map type=$1 threads=4 \
              ${{ matrix.bbox && format('bbox={0}', matrix.bbox) || '' }} tag-conf-file=tag-mapping.xml \
              skip-invalid-relations=true "comment=MudNav - dane (c) OpenStreetMap, ODbL"
          }
          start=$(date +%s)
          if ! write ram; then
            echo "Tryb w pamięci się nie zmieścił – buduję na dysku"
            rm -f out/${{ matrix.id }}.map
            write hd
          fi
          echo "Czas budowania: $(( ($(date +%s) - start) / 60 )) min"
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: maps-${{ matrix.id }}
          path: out/*.map
          retention-days: 3

  # Pasma od razu po zbudowaniu – nie czekają na kraje.
  publish-ranges:
    needs: ranges
    uses: ./.github/workflows/publish.yml
    with:
      pattern: maps-ranges

  publish:
    needs: [ranges, countries, publish-ranges]
    # Kraje dokładamy, gdy są gotowe; pasma publikujemy nawet, gdy któryś kraj się nie zbudował.
    if: always() && needs.ranges.result == 'success'
    uses: ./.github/workflows/publish.yml
    with:
      pattern: maps-*
