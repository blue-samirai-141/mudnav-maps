name: Mapy offline

# Raz w miesiącu (1. dnia w nocy) albo ręcznie: mapy Mapsforge z OpenStreetMap (Geofabrik) – pasma górskie
# (małe pliki) i całe kraje PL/CZ/SK – w wydaniu „latest” razem z katalogiem maps.json. Mapy zmieniają się wolno;
# to, co zmienia się często (zamknięte szlaki, komunikaty), aplikacja pobiera osobno.
on:
  workflow_dispatch:
    inputs:
      only_ranges:
        description: "Tylko pasma górskie (bez map krajów)"
        type: boolean
        default: false
  schedule:
    # 1. dzień miesiąca, 01:41 UTC.
    - cron: "41 1 1 * *"
  # Zmiana regionów albo workflow na main – od razu nowe mapy (gałęzie robocze nie budują).
  push:
    branches: [main]
    paths:
      - "regions.json"
      - ".github/workflows/maps.yml"
      - "tools/**"
      - "!tools/safety.py"

permissions:
  contents: write
  actions: read

concurrency:
  group: maps
  cancel-in-progress: false

env:
  WRITER: https://repo1.maven.org/maven2/org/mapsforge/mapsforge-map-writer/0.21.0/mapsforge-map-writer-0.21.0-jar-with-dependencies.jar

jobs:
  # Dane OSM pobierane raz (Geofabrik dławi kilka równoległych pobrań tego samego pliku – wcześniej Polskę pobierały
  # cztery zadania naraz i pobieranie trwało ponad godzinę). Pozostałe zadania biorą je z artefaktu.
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        country: [poland, czech-republic, slovakia]
    steps:
      - name: Pobranie ${{ matrix.country }}
        run: |
          c="${{ matrix.country }}"
          for i in 1 2 3 4 5 6; do
            url="https://download.geofabrik.de/europe/$c-latest.osm.pbf"
            [ $((i % 2)) = 0 ] && url="https://download.openstreetmap.fr/extracts/europe/${c//-/_}-latest.osm.pbf"
            echo "$(date -u +%T) próba $i: $url"
            curl -sSfL --retry 2 --retry-all-errors --connect-timeout 30 --speed-limit 100000 --speed-time 60 --max-time 3000 -o "$c.osm.pbf" "$url" && break
            [ $i = 6 ] && exit 1; sleep 30
          done
          ls -la "$c.osm.pbf"; date -u +%T
      - uses: actions/upload-artifact@v4
        with:
          name: osm-${{ matrix.country }}
          path: ${{ matrix.country }}.osm.pbf
          retention-days: 1
          compression-level: 0

  ranges:
    needs: download
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: Narzędzia (osmium, osmosis + mapsforge-map-writer)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool osmosis
          mkdir -p ~/.openstreetmap/osmosis/plugins
          curl -sSfL --retry 3 -o ~/.openstreetmap/osmosis/plugins/mapsforge-map-writer.jar "$WRITER"
          pip install -q --break-system-packages "osmium>=4" numpy contourpy shapely
          python3 tools/tag_mapping.py ~/.openstreetmap/osmosis/plugins/mapsforge-map-writer.jar tag-mapping.xml
      - uses: actions/download-artifact@v4
        with:
          pattern: osm-*
          merge-multiple: true
      - name: Dane OSM PL + CZ + SK
        # Limit: zawieszony krok ma się szybko zakończyć błędem, a nie blokować publikację map na godzinę.
        timeout-minutes: 45
        run: |
          # Czas każdego polecenia w logu – widać, który etap trwa długo.
          export PS4='+ $(date -u +%H:%M:%S) '
          set -x
          ls -la *.osm.pbf
          # Kraje pobrane o różnych porach mają te same punkty przy granicy w różnych wersjach – „merge” zostawiał
          # oba (wycinanie pasm padało na „Node ID twice”); apply-changes zostawia najnowszą wersję każdego obiektu.
          osmium apply-changes poland.osm.pbf czech-republic.osm.pbf slovakia.osm.pbf -o raw.osm.pbf
          rm poland.osm.pbf czech-republic.osm.pbf slovakia.osm.pbf
          # Szlaki turystyczne jako osobne linie z kolorem (trail_red=yes …) – patrz tools/trails.py.
          osmium tags-filter raw.osm.pbf r/route=hiking,foot -o hiking.osm.pbf
          python3 tools/trails.py hiking.osm.pbf trails.osm.pbf
          # Pomniki przyrody, wodospady, źródła rzek, kapliczki, wieże widokowe – patrz tools/extra_pois.py.
          osmium tags-filter raw.osm.pbf denotation=natural_monument waterway=waterfall natural=waterfall natural=spring \
            historic=wayside_shrine,wayside_cross,memorial man_made=tower w/waterway=stream,river -o extra-src.osm.pbf
          python3 tools/extra_pois.py extra-src.osm.pbf extra.osm.pbf
          # Jeden podpis na jezioro (zamiast w każdym kaflu) – patrz tools/water_labels.py.
          osmium tags-filter raw.osm.pbf nwr/natural=water nwr/landuse=reservoir,basin -o water-src.osm.pbf
          python3 tools/water_labels.py water-src.osm.pbf water.osm.pbf
          # Parki narodowe i krajobrazowe, rezerwaty, Natura 2000 (relacje type=boundary) – patrz tools/protected.py.
          osmium tags-filter raw.osm.pbf r/boundary=national_park,protected_area r/leisure=nature_reserve -o prot-src.osm.pbf
          python3 tools/protected.py prot-src.osm.pbf prot.osm.pbf
          osmium merge raw.osm.pbf trails.osm.pbf extra.osm.pbf prot.osm.pbf water.osm.pbf -o all.osm.pbf
          rm raw.osm.pbf hiking.osm.pbf trails.osm.pbf extra-src.osm.pbf extra.osm.pbf prot-src.osm.pbf prot.osm.pbf water-src.osm.pbf water.osm.pbf
      - name: Mapy pasm górskich
        env:
          JAVACMD_OPTIONS: -Xmx10g
        run: |
          mkdir -p out
          # label-position=true: jedno miejsce na nazwę obszaru (jeziora, parki) – bez tego nazwa powtarzała się w każdym kaflu.
          python3 - <<'PY'
          import json, subprocess
          for r in json.load(open('regions.json', encoding='utf-8'))['ranges']:
              s, w, n, e = r['bbox']
              sub = f"{r['id']}.osm.pbf"
              subprocess.run(['osmium', 'extract', '-b', f'{w},{s},{e},{n}', '--set-bounds', 'all.osm.pbf', '-o', sub, '--overwrite'], check=True)
              # Graf dróg pieszych dla silnika tras MudNav (out/<id>.walk.gz) – aplikacja pobiera go razem z mapą pasma,
              # więc trasy liczą się w telefonie bez internetu. Błąd grafu nie blokuje mapy.
              try:
                  subprocess.run(['python3', 'tools/walkgraph.py', sub, str(s), str(w), str(n), str(e), f"out/{r['id']}.walk.gz"],
                                 check=True, timeout=1800)
              except (subprocess.CalledProcessError, subprocess.TimeoutExpired) as err:
                  print('::warning::graf tras pominięty dla', r['id'], err)
              # Poziomice z danych wysokościowych + odchudzone kafle wysokości do cieniowania w aplikacji (out/<id>.dem.zip).
              # Gdyby dane wysokości były niedostępne, mapa buduje się bez poziomic.
              try:
                  subprocess.run(['python3', 'tools/contours.py', str(s), str(w), str(n), str(e), 'contours.osm.pbf', 'hgt'], check=True)
                  subprocess.run(['osmium', 'merge', sub, 'contours.osm.pbf', '-o', 'with-contours.osm.pbf', '--overwrite'], check=True)
                  subprocess.run(['mv', 'with-contours.osm.pbf', sub], check=True)
                  subprocess.run(f"cd hgt && zip -q -9 ../out/{r['id']}.dem.zip *.hgt", shell=True, check=True)
              except subprocess.CalledProcessError as err:
                  print('::warning::poziomice pominięte dla', r['id'], err)
              subprocess.run('rm -rf hgt contours.osm.pbf', shell=True)
              subprocess.run(['osmosis', '--rbf', f'file={sub}', '--mapfile-writer', f"file=out/{r['id']}.map",
                              f'bbox={s},{w},{n},{e}', 'type=ram', 'threads=4', 'tag-conf-file=tag-mapping.xml', 'label-position=true',
                              'comment=MudNav - dane (c) OpenStreetMap, ODbL'], check=True)
              subprocess.run(['rm', sub], check=True)
              print(r['id'], 'gotowe')
          PY
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: maps-ranges
          path: |
            out/*.map
            out/*.dem.zip
            out/*.walk.gz
          retention-days: 3

  countries:
    if: ${{ !inputs.only_ranges }}
    needs: download
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        include:
          # Polska w trzech pasach (zachodzą na siebie o ok. 10 km): każdy mieści się w pamięci, a turysta
          # pobiera tylko swój kawałek. Cała Polska budowała się prawie 3 h i ważyła ok. 1 GB.
          - { id: polska-poludnie, geofabrik: poland, bbox: "49.00,14.10,51.10,24.20" }
          - { id: polska-srodek, geofabrik: poland, bbox: "51.00,14.10,52.80,24.20" }
          - { id: polska-polnoc, geofabrik: poland, bbox: "52.70,14.10,54.90,24.20" }
          # Prostokąt zawsze podany: bez niego writer brał granice z nagłówka pliku (po scaleniu ze szlakami – cała
          # Ziemia) i kończyła mu się pamięć.
          - { id: czechy, geofabrik: czech-republic, bbox: "48.54,12.08,51.07,18.87" }
          - { id: slowacja, geofabrik: slovakia, bbox: "47.72,16.82,49.62,22.58" }
    steps:
      - uses: actions/checkout@v4
      - name: Narzędzia
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq osmosis osmium-tool
          mkdir -p ~/.openstreetmap/osmosis/plugins
          curl -sSfL --retry 3 -o ~/.openstreetmap/osmosis/plugins/mapsforge-map-writer.jar "$WRITER"
          pip install -q --break-system-packages "osmium>=4" shapely
          python3 tools/tag_mapping.py ~/.openstreetmap/osmosis/plugins/mapsforge-map-writer.jar tag-mapping.xml
      - uses: actions/download-artifact@v4
        with:
          name: osm-${{ matrix.geofabrik }}
      - name: Odchudzenie danych
        # Mapa kraju: tylko to, co rysuje mapa turystyczna. Budynki z nazwą lub funkcją (schroniska, kościoły, sklepy)
        # zostają z pełnymi tagami; zwykłe domy jako sam obrys bez adresów i bez drobnicy (tools/buildings.py).
        # Pasma górskie mają pełne dane.
        run: |
          # Dane pobrane raz w zadaniu „download” (artefakt osm-<kraj>).
          mv "${{ matrix.geofabrik }}.osm.pbf" in.osm.pbf
          osmium tags-filter in.osm.pbf \
            nwr/highway nwr/railway nwr/aeroway nwr/aerialway nwr/waterway nwr/natural nwr/landuse nwr/leisure \
            nwr/amenity nwr/tourism nwr/historic nwr/man_made nwr/place nwr/sport nwr/shop nwr/military nwr/water \
            nwr/wetland nwr/mountain_pass nwr/piste:type nwr/power=line,minor_line,tower nwr/name \
            r/route r/boundary=administrative,national_park,protected_area r/type=multipolygon \
            -o slim.osm.pbf --overwrite
          # Szlaki turystyczne jako osobne linie z kolorem (trail_red=yes …) – patrz tools/trails.py.
          osmium tags-filter in.osm.pbf r/route=hiking,foot -o hiking.osm.pbf
          python3 tools/trails.py hiking.osm.pbf trails.osm.pbf
          osmium tags-filter in.osm.pbf denotation=natural_monument waterway=waterfall natural=waterfall natural=spring \
            historic=wayside_shrine,wayside_cross,memorial man_made=tower w/waterway=stream,river -o extra-src.osm.pbf
          python3 tools/extra_pois.py extra-src.osm.pbf extra.osm.pbf
          osmium tags-filter in.osm.pbf nwr/natural=water nwr/landuse=reservoir,basin -o water-src.osm.pbf
          python3 tools/water_labels.py water-src.osm.pbf water.osm.pbf
          osmium tags-filter in.osm.pbf r/boundary=national_park,protected_area r/leisure=nature_reserve -o prot-src.osm.pbf
          python3 tools/protected.py prot-src.osm.pbf prot.osm.pbf
          # Zwykłe domy: sam obrys (building=yes), potem dobranie ich punktów z danych źródłowych.
          osmium tags-filter in.osm.pbf w/building -o bsrc.osm.pbf
          python3 tools/buildings.py bsrc.osm.pbf bways.osm.pbf
          osmium getid -r -I bways.osm.pbf bsrc.osm.pbf -o bfull.osm.pbf
          osmium cat bfull.osm.pbf -t node -o bnodes.osm.pbf
          rm in.osm.pbf bsrc.osm.pbf bfull.osm.pbf
          osmium merge slim.osm.pbf trails.osm.pbf extra.osm.pbf prot.osm.pbf bnodes.osm.pbf bways.osm.pbf water.osm.pbf -o merged.osm.pbf --overwrite
          mv merged.osm.pbf slim.osm.pbf
          rm hiking.osm.pbf trails.osm.pbf extra-src.osm.pbf extra.osm.pbf prot-src.osm.pbf prot.osm.pbf bnodes.osm.pbf bways.osm.pbf water-src.osm.pbf water.osm.pbf
          # Część kraju: wycinek prostokąta (bbox w regions.json: minLat,minLon,maxLat,maxLon; osmium chce lon,lat).
          IFS=, read -r s w n e <<< "${{ matrix.bbox }}"
          osmium extract -b "$w,$s,$e,$n" slim.osm.pbf -o part.osm.pbf --overwrite
          mv part.osm.pbf slim.osm.pbf
          ls -la slim.osm.pbf
      - name: Mapa kraju (najpierw w pamięci, przy braku pamięci – na dysku)
        env:
          JAVACMD_OPTIONS: -Xmx14g
        run: |
          mkdir -p out
          write() {
            osmosis --rbf file=slim.osm.pbf --mapfile-writer file=out/${{ matrix.id }}.map type=$1 threads=4 \
              ${{ matrix.bbox && format('bbox={0}', matrix.bbox) || '' }} tag-conf-file=tag-mapping.xml label-position=true \
              skip-invalid-relations=true "comment=MudNav - dane (c) OpenStreetMap, ODbL"
          }
          start=$(date +%s)
          if ! write ram; then
            echo "Tryb w pamięci się nie zmieścił – buduję na dysku"
            rm -f out/${{ matrix.id }}.map
            write hd
          fi
          echo "Czas budowania: $(( ($(date +%s) - start) / 60 )) min"
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: maps-${{ matrix.id }}
          path: out/*.map
          retention-days: 3

  # Pasma od razu po zbudowaniu – nie czekają na kraje.
  publish-ranges:
    needs: ranges
    uses: ./.github/workflows/publish.yml
    with:
      pattern: maps-ranges

  publish:
    needs: [ranges, countries, publish-ranges]
    # Kraje dokładamy, gdy są gotowe; pasma publikujemy nawet, gdy któryś kraj się nie zbudował.
    if: always() && needs.ranges.result == 'success' && !inputs.only_ranges
    uses: ./.github/workflows/publish.yml
    with:
      pattern: maps-*
