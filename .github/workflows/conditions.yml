name: Warunki (komunikat lawinowy dla aplikacji)

# Pliki conditions.json (komunikaty, kilka KB – aplikacja pobiera przy każdym uruchomieniu) i avalanche-regions.json
# (granice regionów EAWS, CC0) w wydaniu „conditions”.
# Ręcznie: pole „manual” (komunikat do testów, format w tools/conditions.py) i „region”.
# Automatycznie co godzinę w sezonie: TOPR, HZS (laviny.sk) i GOPR – źródła w tools/conditions.py.
on:
  schedule:
    # Co godzinę; poza sezonem (czerwiec–październik) przebieg kończy się od razu (krok „Sezon”).
    # Lista miesięcy w polu cron („11,12,1,…”) nie uruchamiała akcji wcale (retest 5, O33).
    - cron: "23 * * * *"
  workflow_dispatch:
    inputs:
      manual:
        description: "Komunikat (JSON, patrz tools/conditions.py)"
        required: false
      region:
        description: "Region EAWS dla komunikatu ręcznego (PL-12 = TOPR, SK-01…, PL-01…)"
        required: false
        default: "PL-12"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Sezon
        id: season
        run: |
          m=$(date -u +%-m)
          if [ "${{ github.event_name }}" = schedule ] && [ "$m" -ge 6 ] && [ "$m" -le 10 ]; then echo on=0 >> "$GITHUB_OUTPUT"; else echo on=1 >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v4
        if: steps.season.outputs.on == '1'
      - name: conditions.json
        if: steps.season.outputs.on == '1'
        env:
          MANUAL: ${{ inputs.manual }}
          REGION: ${{ inputs.region }}
        run: |
          args=(--topr --slovakia --gopr --regions avalanche-regions.json --keep "https://github.com/${{ github.repository }}/releases/download/conditions/conditions.json")
          if [ -n "$MANUAL" ]; then args+=(--manual "$MANUAL" --region "${REGION:-PL-12}"); fi
          python3 tools/conditions.py "${args[@]}" conditions.json
          echo '```json' >> "$GITHUB_STEP_SUMMARY"; cat conditions.json >> "$GITHUB_STEP_SUMMARY"; echo '```' >> "$GITHUB_STEP_SUMMARY"
      - name: Wydanie „conditions”
        if: steps.season.outputs.on == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view conditions >/dev/null 2>&1 || gh release create conditions --title "Warunki (komunikaty)" --notes "conditions.json dla aplikacji MudNav – nadpisywany przy każdym komunikacie."
          gh release upload conditions conditions.json avalanche-regions.json --clobber
