name: Bezpieczeństwo (codziennie)

# Codziennie rano: zamknięte szlaki (OSM), zagrożenie lawinowe i komunikaty parków → safety.json i closures.tsv
# w wydaniu „latest”. Aplikacja pobiera je raz dziennie (bez internetu – ostatnio pobrane).
on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"
  push:
    paths:
      - "tools/safety.py"
      - "sources.json"
      - ".github/workflows/safety.yml"

permissions:
  contents: write

concurrency:
  group: safety
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Sprawdzenie źródeł
        run: python3 tools/safety.py
      - name: Publikacja w wydaniu „latest”
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view latest >/dev/null 2>&1; then
            gh release create latest --title "Mapy offline MudNav" \
              --notes "Mapy Mapsforge z OpenStreetMap dla aplikacji MudNav. Dane © współtwórcy OpenStreetMap, licencja ODbL."
          fi
          files="safety.json"
          [ -s closures.tsv ] && files="$files closures.tsv"
          gh release upload latest $files --clobber
